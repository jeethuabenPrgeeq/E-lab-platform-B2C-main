services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elab
      POSTGRES_PASSWORD: elab
      POSTGRES_DB: elab
    ports:
      - "5433:5432"
    volumes:
      - elab_postgres_data:/var/lib/postgresql/data

volumes:
  elab_postgres_data:
